
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Raya Aber AI</title>
<style>
* { box-sizing: border-box; }

body {
    margin: 0;
    background: #10101d;
    color: white;
    font-family: Arial, sans-serif;
    display: flex;
    justify-content: center;
    min-height: 100vh;
}

.app {
    width: 100%;
    max-width: 600px;
    padding: 20px;
    display: flex;
    flex-direction: column;
}

header {
    text-align: center;
    padding: 25px;
}

.avatar {
    width: 75px;
    height: 75px;
    margin: auto;
    border-radius: 50%;
    background: linear-gradient(135deg, #8b5cf6, #20c9a6);
    display: grid;
    place-items: center;
    font-size: 32px;
}

h1 { margin-bottom: 5px; }

.status {
    color: #55d6a5;
    font-size: 13px;
}

#messages {
    flex: 1;
    min-height: 300px;
    overflow-y: auto;
    padding: 10px 0;
}

.message {
    padding: 13px 16px;
    border-radius: 15px;
    margin: 10px 0;
    max-width: 85%;
    line-height: 1.5;
    white-space: pre-wrap;
}

.bot {
    background: #24243b;
    align-self: flex-start;
}

.user {
    background: #6545bd;
    margin-left: auto;
}

form {
    display: flex;
    gap: 8px;
    padding: 12px 0;
}

input {
    flex: 1;
    min-width: 0;
    padding: 15px;
    border: 1px solid #44445e;
    border-radius: 12px;
    background: #202033;
    color: white;
    font-size: 16px;
}

button {
    border: 0;
    border-radius: 12px;
    padding: 0 18px;
    background: #8256df;
    color: white;
    font-size: 16px;
}
</style>
</head>

<body>
<div class="app">

<header>
    <div class="avatar">R</div>
    <h1>Raya Aber</h1>
    <div class="status">● Система запущена</div>
</header>

<div id="messages">
    <div class="message bot">
        Привет! Я Райя Абер.
        Рада знакомству! Чем могу помочь?
    </div>
</div>

<form id="chat">
    <input id="input" placeholder="Напиши Райе..." autocomplete="off">
    <button type="submit">➤</button>
</form>

</div>

<script>
const messages = document.getElementById("messages");
const form = document.getElementById("chat");
const input = document.getElementById("input");

function addMessage(text, type) {
    const div = document.createElement("div");
    div.className = "message " + type;
    div.textContent = text;
    messages.appendChild(div);
    messages.scrollTop = messages.scrollHeight;
}

form.addEventListener("submit", async (event) => {
    event.preventDefault();

    const text = input.value.trim();
    if (!text) return;

    addMessage(text, "user");
    input.value = "";

    try {
        const response = await fetch("/api/chat", {
            method: "POST",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify({message: text})
        });

        const data = await response.json();
        addMessage(data.reply, "bot");
    } catch (error) {
        addMessage("Пока я не подключена к серверу. Но скоро заработаю!", "bot");
    }
});
</script>

</body>
</html>
